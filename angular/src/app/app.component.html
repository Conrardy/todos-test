<div>
  <h1>To-Do List</h1>
  <input [(ngModel)]="todoName" placeholder="Enter todo name" />
  <button (click)="fetchTodo()">Get Todo</button>
  <div *ngIf="fetchedTodo">
    <h3>Fetched Todo:</h3>
    <p>Name: {{ fetchedTodo.name }}</p>
    <p>Completed: {{ fetchedTodo.completed }}</p>
  </div>
  <input [(ngModel)]="newTask" placeholder="Add a new task"/>
  <button (click)="addTask()">Add Task</button>
  <button (click)="fetchTasks()">Fetch Tasks</button>
  <ul>
    <li *ngFor="let task of tasks; let i = index" class="task-item">
      <input type="checkbox" [(ngModel)]="task.completed" (change)="toggleComplete(i)" class="task-checkbox"/>
      <span [ngClass]="{ completed: task.completed }" class="task-text">{{ task.name }}</span>
      <button (click)="deleteTask(i)" class="task-delete">Delete</button>
    </li>
  </ul>
</div>
